<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карточка товара Mentos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <article class="product-card">
      <header class="top-line">
        <div class="logo">mentos<sup>®</sup></div>
        <div class="heart">♡</div>
      </header>

      <div class="photo-wrap">
        <img src="images/mentos-pure-fresh.webp" alt="Жевательная резинка Mentos Pure Fresh">
      </div>

      <section class="details">
        <div class="promos">
          <div class="pill pill-purple">
            <span class="card-icon">=</span>
            <span>0% до 140 дней</span>
          </div>
          <div class="pill pill-green">
            <span class="like-icon">👍</span>
            <span>Цена что надо</span>
          </div>
        </div>

        <div class="dots" aria-label="Фото 1 из 6">
          <i class="active"></i><i></i><i></i><i></i><i></i><i></i>
        </div>

        <div class="price-line">
          <strong class="price">812 ₽</strong>
          <span class="old-price">1120 ₽</span>
          <strong class="discount">−27%</strong>
        </div>

        <div class="bonus"><span class="sparkle">✦</span><span>10 и 1 ₽</span></div>

        <div class="description">
          <div class="brand">Mentos</div>
          <div class="product-name">Жевательная резинка<br>Mentos Pure Fresh вкус...</div>
        </div>

        <div class="rating-line">
          <span class="star">★</span>
          <b>5.0</b>
          <span class="comment-icon"></span>
          <span class="reviews">3 273</span>
        </div>
      </section>

      <div class="installment">
        <span class="bag-icon">🛍️</span>
        <span>Заказать</span>
      </div>
    </article>
  </main>
</body>
</html>
